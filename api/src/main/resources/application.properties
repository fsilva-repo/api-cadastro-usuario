spring.config.import=file:.env[.properties]
#spring.config.import=file:/home/arcade/Desktop/api-cadastro-usuario/.env[.properties]
spring.application.name=api


# MongoDB (Podman)
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=userdb
spring.mongodb.authentication-database=admin
spring.mongodb.username=${MONGO_USER}
spring.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.auto-index-creation=true


# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=user-registration-app
app.jwt.expiration-minutes=60

# Cookie da sessão (usada só durante o redirecionamento ao Google)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Erro não expõe detalhes internos
server.error.include-stacktrace=never