services:
  mongo:
    image: docker.io/library/mongo:8
    container_name: mongo-users
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-users-data:/data/db

volumes:
  mongo-users-data:
    name: mongo-users-data
